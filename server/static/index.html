          <div style="font-weight:600;display:flex;align-items:center;gap:6px;">
            <span style="color:#68d391">●</span> Google OAuth 2.0 (Read-Only)
          </div>
          <div class="mute" style="font-size:12px;margin:6px 0 12px">Scopes: yt-analytics.readonly & youtube.readonly</div>
          <button class="b" id="v2ConnectBtn">Connect YouTube Channel</button>
          <span class="mute" id="v2ConnMsg" style="margin-left:8px;font-size:12px;"></span>
        </div>
      </div>

      <div class="card">
        <h3>💡 AI Channel Insights</h3>
        <div class="mute" style="margin-bottom:8px">Patterns learned from high-performing playlists:</div>
        <ul style="margin:10px 0;padding-left:18px;font-size:13px;line-height:1.7;">
          <li><b>Title CTR Booster:</b> Titles with curiosity hooks (<i>"The only music you need to..."</i>) score <b>+34% higher CTR</b>.</li>
          <li><b>Winning Thumbnails:</b> <code>swirl (mono)</code> and <code>room (blue)</code> yield <b>1.8x longer watch duration</b>.</li>
          <li><b>Retention Protection:</b> Upbeat songs at track #1 and #2 maintain <b>72% 30-second retention</b>.</li>
        </ul>
      </div>
    </div>

    <div class="card" style="margin-top:10px;">
      <h3>🎯 Studio Tools for YouTube</h3>
      <div class="row" style="gap:10px;margin-top:10px;flex-wrap:wrap">
        <button class="b" id="v2GenTitles">Generate 3 A/B Tested Titles</button>
        <button class="g" id="v2GenSrt">Export YouTube Captions (.srt)</button>
      </div>
      <div id="v2ToolsOut" style="margin-top:14px;"></div>
    </div>
  `;

  $('#v2Back').onclick = () => { step = 3; render(); };
  $('#v2ConnectBtn').onclick = () => {
    $('#v2ConnMsg').textContent = 'Connecting… (OAuth prompt opening)';
    setTimeout(() => { $('#v2ConnMsg').textContent = '✓ Ready: OAuth flow registered in v2 roadmap.'; }, 800);
  };

  $('#v2GenTitles').onclick = () => {
    const raw = title.replace(/^\[Playlist\]\s*/i, '');
    const tA = `[Playlist] The only music you need to relax`;
    const tB = `Relaxing Chill & Indie Songs to Unwind / Study (Full Playlist)`;
    const tC = `songs that feel like a quiet rainy evening • cozy aesthetic playlist`;
    $('#v2ToolsOut').innerHTML = `
      <div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;">
        <div style="font-weight:600;margin-bottom:8px;color:#63b3ed">A/B Title Variants for YouTube Studio "Test & Compare":</div>
        <div style="margin:8px 0;"><b>Variant A (CTR Hook):</b> <input type="text" readonly value="${esc(tA)}" style="width:100%;margin-top:4px;" id="v2_ta"></div>
        <div style="margin:8px 0;"><b>Variant B (SEO / Search):</b> <input type="text" readonly value="${esc(tB)}" style="width:100%;margin-top:4px;" id="v2_tb"></div>
        <div style="margin:8px 0;"><b>Variant C (Vibe / Emotional):</b> <input type="text" readonly value="${esc(tC)}" style="width:100%;margin-top:4px;" id="v2_tc"></div>
      </div>
    `;
  };

  $('#v2GenSrt').onclick = () => {
    let srt = '';
    let curSec = 0;
    const pad = (n, w=2) => String(n).padStart(w, '0');
    const fmtSrt = s => {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
      return `${pad(h)}:${pad(m)}:${pad(sec)},000`;
    };
    tracks.forEach((t, i) => {
      const dur = +(t.duration || 180);
      const start = fmtSrt(curSec);
      const end = fmtSrt(curSec + dur);
      srt += `${i + 1}\n${start} --> ${end}\n${t.title} - ${t.artist || ''}\n\n`;
      curSec += dur;
    });
    const blob = new Blob([srt], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.srt`;
    a.click();
    $('#v2ToolsOut').innerHTML = `<div class="mute okbox" style="padding:10px;border-radius:8px;">✓ Captions file <b>${esc(a.download)}</b> exported! Drop this into YouTube Studio's "Subtitles" section.</div>`;
  };
}

function initVersionSwitch(){
  const v1 = $('#v1Btn'), v2 = $('#v2Btn');
  if (!v1 || !v2) return;
  const updateUI = () => {
    if (appVersion === 'v2') {
      v2.className = 'b'; v2.style.background = ''; v2.style.color = '#fff';
      v1.className = 'g'; v1.style.background = 'transparent'; v1.style.color = 'var(--text-mute)';
    } else {
      v1.className = 'b'; v1.style.background = ''; v1.style.color = '#fff';
      v2.className = 'g'; v2.style.background = 'transparent'; v2.style.color = 'var(--text-mute)';
    }
  };
  v1.onclick = () => {
    if (appVersion !== 'v1') {
      appVersion = 'v1'; localStorage.setItem('senora_version', 'v1'); updateUI();
      if (step > 3) step = 3;
      toast('Switched to Senora v1 (Stable Core)');
      render();
    }
  };
  v2.onclick = () => {
    if (appVersion !== 'v2') {
      appVersion = 'v2'; localStorage.setItem('senora_version', 'v2'); updateUI();
      toast('Switched to Senora v2 (YouTube Studio & AI Engine)');
      render();
    }
  };
  updateUI();
}

/* ---------- job progress: a simple moving panel, inline (no popup) ---------- */
function panelHtml(kind, pct, steps, cur, secs, detail, state){
  const title = state === 'done' ? 'Finished' : state === 'fail' ? 'Something went wrong' : state === 'stopped' ? 'Stopped' : (kind === 'extract' ? 'Extracting audio and pictures' : 'Building your video');
  return `<div class="prog ${state||''}"><div class="prog-head"><span class="spin"></span><b>${title}</b><span class="mute t">${fmt(secs)} elapsed</span></div>
    <div class="pbar"><i style="width:${Math.max(2, Math.min(100, pct))}%"></i></div>
    <ul class="psteps">${steps.map((x,i) => `<li class="${state==='done' ? 'done' : i<cur ? 'done' : i===cur ? 'cur' : 'todo'}">${x}</li>`).join('')}</ul>
    <div class="mute" style="margin-top:8px">${detail}</div></div>`;
}

let helperMode = 'local', helperConnected = false;

/* On GitHub Pages the pictures, videos and downloads live on your Mac: point every /api/ link there. */
if (BASE) {
  const fix = el => { for (const a of ['src', 'href']) { const v = el.getAttribute && el.getAttribute(a); if (v && v.startsWith('/api/')) el.setAttribute(a, BASE + v); } };
  const fixTree = n => { if (n.nodeType !== 1) return; fix(n); n.querySelectorAll('[src^="/api/"],[href^="/api/"]').forEach(fix); };
  new MutationObserver(ms => ms.forEach(m => { m.addedNodes.forEach(fixTree); if (m.type === 'attributes') fix(m.target); }))
    .observe(document.body, {childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'href']});
  fixTree(document.body);
}
const MAC_LINK = 'senora-helper://start';
let macDown = false, connectedAt = 0;
const fmtClock = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
async function helperRefresh(){
  try {
    const h = await api('/api/helper');
    macDown = false;
    helperMode = h.mode; helperConnected = h.connected;
    if (BASE && !connectedAt) connectedAt = Date.now();          // the page on GitHub reached your Mac: start the clock
    $('#helperBtn').textContent = h.mode === 'cloud' ? (h.connected ? 'Computer: connected' : 'Connect my computer') : 'Helper: ' + (h.on ? 'ON' : 'OFF');
    $('#helperBtn').classList.toggle('on', h.mode === 'cloud' ? h.connected : h.on);
    if (!$('#helperMsg').dataset.code && !BASE) $('#helperMsg').textContent = h.message;      // on GitHub Pages only the clock is shown
    if (h.connected) { $('#helperMsg').dataset.code = ''; }
  } catch (e) {
    macDown = true; connectedAt = 0;
    if (BASE) { $('#helperBtn').textContent = 'Start Senora on my Mac'; $('#helperBtn').classList.remove('on');
      $('#helperMsg').textContent = 'Your Mac is off or Senora is not started. Press the button; it starts by itself.'; }
  }
}
$('#helperBtn').onclick = async () => {
  if (macDown) { location.href = MAC_LINK; setTimeout(helperRefresh, 4000); return; }
  if (helperMode === 'cloud') {
    try {
      if (helperConnected) {
        if (!confirm('Disconnect your computer? It will stop fetching songs until you connect it again.')) return;
        await api('/api/helper/disconnect', {method: 'POST'});
      } else {
        const r = await api('/api/helper/pair', {method: 'POST'});
        $('#helperMsg').dataset.code = r.code;
        $('#helperMsg').textContent = `On your computer run:  ./start_senora helper ${location.origin}   and type this code: ${r.code}  (works for ${Math.round(r.expires_in / 60)} minutes)`;
        location.href = `senora-helper://connect?server=${encodeURIComponent(location.origin)}&code=${r.code}`;   // starts Senora Helper if it is installed
      }
    } catch (e) { toast(e.message); }
    return helperRefresh();
  }
  const on = !$('#helperBtn').textContent.endsWith('ON');
  try { await api('/api/helper', J('PUT', {on})); } catch (e) { toast(e.message); }
  helperRefresh();
};
setInterval(helperRefresh, 4000); helperRefresh();
setInterval(() => { if (macDown) helperRefresh(); }, 2000);
setInterval(() => { if (connectedAt) $('#helperMsg').textContent = `Connected to your Mac for ${fmtClock(Math.floor((Date.now() - connectedAt) / 1000))}`; }, 1000);

function songsHtml(songs){
  if (!songs || !songs.length) return '';
  const label = {waiting: 'waiting', fetching: 'fetching…', done: 'done', failed: 'failed', skipped: 'skipped'};
  return '<ul class="psteps" style="margin-top:8px">' + songs.map((x, i) =>
    `<li class="${x.state === 'done' ? 'done' : x.state === 'fetching' ? 'cur' : 'todo'}">Song ${i + 1}: ${esc(x.title || x.link)} <span class="mute">${label[x.state] || x.state}${x.secs ? ' · ' + x.secs + 's' : ''}${x.note && x.state === 'fetching' ? ' · ' + esc(x.note) : ''}${x.error ? ' · ' + esc(x.error) : ''}</span></li>`).join('') + '</ul>';
}
function progressFor(kind, j, secs, estSec){
  const m = j.message || '';
  if (kind === 'extract') {
    const steps = ['Download and convert', 'Analyse audio'];
    const t = m.match(/track (\d+)\/(\d+)/), a = m.match(/analysing audio (\d+)\/(\d+)/);
    if (a) return {pct: 80 + (+a[1] / +a[2]) * 18, steps, cur: 1, detail: `Checking each song for extra audio (${a[1]} of ${a[2]})`};
    if (t) return {pct: ((+t[1] - 0.5) / +t[2]) * 80, steps, cur: 0, detail: `Song ${t[1]} of ${t[2]}` + songsHtml(j.songs)};
    return {pct: 3, steps, cur: 0, detail: 'Starting…'};
  }
  const steps = ['Video', 'Thumbnail', 'Title', 'Description'];
  const k = +((m.match(/stage (\d)\/4/) || [0, 1])[1]) - 1;
  const base = [0, 88, 93, 97];
  let pct = base[k];
  if (k === 0) {
    if (estSec > 0) {
      if (secs < estSec) {
        pct = Math.min(85, (secs / estSec) * 85);
      } else {
        pct = Math.min(87.5, 85 + (1 - Math.exp(-(secs - estSec) / Math.max(30, estSec * 0.3))) * 2.5);
      }
    } else {
      pct = 50;
    }
  }
  const left = k === 0 ? Math.max(0, estSec - secs) : 0;
  let detail = k === 0 ? (left > 5 ? `About ${Math.ceil(left / 60)} min left (estimate, from the video length)` : 'Almost there…')
                         : 'Writing the thumbnail, title and description';
  if (j.kind === 'send' && m && !m.startsWith('starting')) detail = m;
  return {pct, steps, cur: k, detail};
}
function watch(jid, el, done, kind='extract', estSec=60){
  clearInterval(poll);
  let fails = 0;
  const tick = async () => {
    if (!el || !el.isConnected) { clearInterval(poll); return; }      // you went to another page: the job keeps running, this panel is gone
    let j = null;
    let macDown = false;
    try {
      j = await api('/api/jobs/'+jid);
      fails = 0;
    } catch (e) {
      macDown = true;
      fails++;
    }

    const isCloud = kind === 'send' || (jid && String(jid).startsWith('send-')) || (j && j.kind === 'send');

    if (isCloud) {
      try {
        // Direct GitHub check (works even when Mac localhost is completely stopped)
        const runsRes = await fetch(`${GH_API}/actions/workflows/render-job.yml/runs?per_page=5`, {headers: ghHeaders()});
        if (runsRes.ok) {
          const runsData = await runsRes.json();
          const latestRun = (runsData.workflow_runs || [])[0];
          if (latestRun) {
            const tag = latestRun.head_branch || '';
            const jobId = tag.replace('send-', '');
            const relTag = `job-${jobId}`;

            // Check if release is already published on GitHub
            const relRes = await fetch(`${GH_API}/releases/tags/${relTag}`, {headers: ghHeaders()});
            if (relRes.ok) {
              const relData = await relRes.json();
              const assets = relData.assets || [];
              if (assets.some(a => a.name.endsWith('.mp4'))) {
                clearInterval(poll);
                el.innerHTML = panelHtml('build', 100, ['Video', 'Thumbnail', 'Title', 'Description'], 4, 0, 'Release published on GitHub!', 'done');
                toast('Video rendered and published on GitHub!');
                renderGitHubReleaseOutputs(relData);
                markBuildComplete(true);
                done && done(true);
                return;
              }
            }

            if (latestRun.status === 'in_progress' || latestRun.status === 'queued') {
              const runSecs = Math.max(0, Math.round((Date.now() - new Date(latestRun.created_at).getTime()) / 1000));
              const pr = progressFor('build', {state: 'running', message: 'GitHub runner rendering...'}, runSecs, estSec);
              const note = macDown
                ? `<span style="color:#68d391;font-weight:bold;">✓ Localhost is offline (Mac is free).</span> Rendering in GitHub Actions cloud.`
                : (j && j.message ? esc(j.message) : `Rendering in GitHub Actions cloud.`);
              el.innerHTML = panelHtml('build', pr.pct, pr.steps, pr.cur, runSecs, note) +
                `<div style="display:flex;gap:8px;margin-top:8px;align-items:center;">` +
                  `<a class="b" href="${latestRun.html_url}" target="_blank" style="text-decoration:none;padding:6px 12px;border-radius:6px;display:inline-block">View GitHub Runner ↗</a>` +
                `</div>`;
              return;
            } else if (latestRun.conclusion === 'failure') {
              clearInterval(poll);
              el.innerHTML = panelHtml('build', 100, [], 0, 0, `<span class="err">GitHub Actions run failed.</span> <a href="${latestRun.html_url}" target="_blank">View run logs ↗</a>`, 'fail');
              done && done(false);
              return;
            }
          }
        }
      } catch (ghErr) {}

      if (macDown) {
        el.innerHTML = panelHtml('build', 75, ['Video', 'Thumbnail', 'Title', 'Description'], 0, 0,
          `<b>Rendering on GitHub Actions in the cloud…</b> (Your Mac is offline/resting, but GitHub is building your video uninterrupted in the cloud).`) +
          `<div style="margin-top:8px;"><button class="b" onclick="location.reload()">Check Status</button></div>`;
        return;
      }
    }

    if (macDown) {
      if (fails > 4) {
        clearInterval(poll);
        el.innerHTML = panelHtml(kind, 100, [], 0, 0, `<span class="err">${esc(e.message)}</span>`, 'fail');
        done && done(false);
      }
      return;
    }
    const secs = Math.max(0, Math.round(Date.now()/1000 - (j.started || (Date.now()/1000))));
    const pr = progressFor(kind, j, secs, estSec);
    if (j.state === 'running') {
      el.innerHTML = panelHtml(kind, pr.pct, pr.steps, pr.cur, secs, pr.detail) +
        `<div style="display:flex;gap:8px;margin-top:8px;align-items:center;">` +
          `<button class="g" data-stop>Stop</button>` +
          `<button class="b" data-term style="background:#e53e3e;border-color:#c53030;color:#fff;">Terminate</button>` +
        `</div>`;
      const onEnd = async (action) => {
        const sBtn = el.querySelector('[data-stop]'), tBtn = el.querySelector('[data-term]');
        if (sBtn) sBtn.disabled = true;
        if (tBtn) { tBtn.disabled = true; tBtn.textContent = 'Terminating…'; }
        try { await api(`/api/jobs/${jid}/${action}`, {method: 'POST'}); } catch (e) {}
        if (action === 'terminate') {
          clearInterval(poll);
          el.innerHTML = '';
          done && done(false);
          toast('Render terminated.');
          return;
        }
        tick();
      };
      el.querySelector('[data-stop]').onclick = () => onEnd('stop');
      el.querySelector('[data-term]').onclick = () => onEnd('terminate');
      return;
    }
    clearInterval(poll);
    if (j.state === 'terminated') {
      el.innerHTML = '';
      done && done(false);
      toast('Render terminated.');
      return;
    }
    if (j.state === 'interrupted' || j.state === 'stopped') {
      el.innerHTML = panelHtml(kind, Math.max(pr.pct, 5), pr.steps, pr.cur, secs, esc(j.message), 'stopped') +
        `<div style="display:flex;gap:8px;margin-top:8px;align-items:center;">` +
          `<button class="b" data-resume>Resume</button>` +
          `<button class="g" data-clear style="color:#ff6b6b;border-color:#c53030;">Terminate & Clear</button>` +
        `</div>`;
      el.querySelector('[data-resume]').onclick = () => (document.querySelector('#ghRender') || document.querySelector('#go')).click();
      el.querySelector('[data-clear]').onclick = async () => {
        try { await api(`/api/jobs/${jid}/terminate`, {method: 'POST'}); } catch (e) {}
        el.innerHTML = '';
        done && done(false);
      };
      done && done(false); return;
    }
    if (j.state === 'done') {
      el.innerHTML = panelHtml(kind, 100, pr.steps, pr.steps.length, secs, 'All done.', 'done');
      toast(`Done in ${fmt(secs)}.`); done && done(true);
    } else {
      el.innerHTML = panelHtml(kind, Math.max(pr.pct, 5), pr.steps, pr.cur, secs, `<span class="err">${esc(j.message)}</span> Check the terminal where the server runs, then try again.`, 'fail') +
        `<div style="display:flex;gap:8px;margin-top:8px;align-items:center;">` +
          `<button class="b" data-resume>Try again</button>` +
          `<button class="g" data-clear style="color:#ff6b6b;border-color:#c53030;">Dismiss</button>` +
        `</div>`;
      el.querySelector('[data-resume]').onclick = () => (document.querySelector('#ghRender') || document.querySelector('#go')).click();
      el.querySelector('[data-clear]').onclick = async () => {
        try { await api(`/api/jobs/${jid}/terminate`, {method: 'POST'}); } catch (e) {}
        el.innerHTML = '';
        done && done(false);
      };
      done && done(false);
    }
  };
  poll = setInterval(tick, 1000); tick();
}

(async () => {
  initVersionSwitch();
  api('/api/github-token').then(r => { if (r.token) localStorage.setItem('senora_gh_token', r.token); }).catch(() => {});
  let ui = {}; try { ui = await api('/api/ui-state'); } catch (e) {}
  if (ui.mode === 'pl' && ui.pid) {
    mode = 'pl'; await loadProjects(ui.pid);
    if (P && P.id === ui.pid) { step = Math.max(0, Math.min(3, ui.step || 0)); render(); } else { mode = 'lib'; render(); }
  } else { mode = 'lib'; catId = ui.catId || null; await loadProjects(); }
  if (ui.scroll) setTimeout(() => scrollTo(0, ui.scroll), 900);
})();
